# Meson cross file for the 32-bit (i686) half of the CoPresent GL stack.
#
# Not a foreign toolchain: this is the build host's own gcc driven with -m32
# against the multilib runtime. Meson still has to be told it is cross
# compiling, or it assumes the build machine's pointer size when it configures
# Mesa's generated sources.
#
# The 32-bit half is not optional. Steam's client is i386 and asks the 32-bit
# loader for both GL and Vulkan; with a 64-bit-only stack it renders through
# software and its Vulkan probe fails with VK_ERROR_INCOMPATIBLE_DRIVER. See
# doc/building-copresent.
#
# Build-host requirements beyond the 64-bit set: gcc multilib (`gcc -m32`) and
# the i686 development libraries for X11/XCB, libdrm, expat, zlib and zstd. On
# Arch that is the lib32-* packages; `pkg-config --exists` against the
# pkg_config_libdir below is the check that matters.

[binaries]
c = ['gcc', '-m32']
cpp = ['g++', '-m32']
ar = 'gcc-ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
# The 32-bit .pc files, plus the noarch directory carrying the header-only X
# protocol packages (xproto, kbproto, xf86vidmodeproto). Those exist once for
# both ABIs, and leaving the second path out fails configuration with
# "Package xproto was not found" even though everything is installed.
pkg_config_libdir = '/usr/lib32/pkgconfig:/usr/share/pkgconfig'

[built-in options]
c_args = ['-m32']
c_link_args = ['-m32']
cpp_args = ['-m32']
cpp_link_args = ['-m32']
libdir = 'lib32'

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
